[project]
name = "sample-ai-api-unified"
version = "0.8.1"
description = "Textual TUI sample app for ai-api-unified: one Python API across OpenAI, Anthropic Claude, Google Gemini, and AWS Bedrock for completions, tool use, structured output, model fallback, embeddings, image, video, and voice."
authors = [{ name = "Dave Thomas" }]
license = { text = "MIT" }
readme = "README.md"
keywords = [
    "ai-api-unified",
    "llm",
    "generative-ai",
    "multi-provider",
    "openai",
    "anthropic",
    "claude",
    "google-gemini",
    "aws-bedrock",
    "model-fallback",
    "tool-calling",
    "structured-output",
    "embeddings",
    "image-generation",
    "video-generation",
    "text-to-speech",
    "textual",
    "tui",
    "sample-app",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "textual>=0.60,<2",
    "rich>=13.7,<15",
    "PyYAML>=6.0.1,<7",
    "python-dotenv>=1.0,<2",
]

# ai-api-unified is intentionally NOT declared here. The Makefile installs it
# into the Poetry virtualenv from either the local checkout (editable) or the
# latest PyPI release, so the two sources can be swapped without touching the
# lock file. See `make use-local` and `make use-pypi`.

[project.urls]
Repository = "https://github.com/davecthomas/sample-ai-api-unified"
Library = "https://pypi.org/project/ai-api-unified/"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24",
    "Pillow>=10",
]

[project.scripts]
sample-ai-api-unified = "sample_ai_api_unified.tui.app:main"

[tool.poetry]
packages = [{ include = "sample_ai_api_unified", from = "src" }]
include = [{ path = "src/sample_ai_api_unified/tui/styles.tcss", format = ["sdist", "wheel"] }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.black]
line-length = 100
